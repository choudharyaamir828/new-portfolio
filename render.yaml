services:
  - type: web
    name: portfolio-backend
    env: python
    plan: free
    buildCommand: ./build.sh
    startCommand: bash start.sh
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: MEDIA_ROOT
        value: /opt/render/project/src/media
      - key: SECRET_KEY
        generateValue: true
      - key: SQLITE_DB_PATH
        value: /opt/render/project/src/db.sqlite3
      - key: ALLOWED_HOSTS
        value: portfolio-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
